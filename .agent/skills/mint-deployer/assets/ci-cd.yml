name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ secrets.AZURE_CONTAINER_APP_NAME }}
  IMAGE_NAME: mint-api

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run Ruff Lint
        run: ruff check .

      - name: Run Mypy Typecheck
        run: mypy src/ tests/

      - name: Run Tests (Unit & Contract)
        run: pytest -m "not integration and not live"

  deploy-staging:
    name: Build & Deploy to Staging
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build & Push Docker Image
        run: |
          ACR_SERVER="${{ env.ACR_NAME }}.azurecr.io"
          TAG="${ACR_SERVER}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          LATEST="${ACR_SERVER}/${{ env.IMAGE_NAME }}:latest"
          docker build -t "$TAG" -t "$LATEST" .
          docker push "$TAG"
          docker push "$LATEST"

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Smoke Test Staging Endpoint
        run: |
          STAGING_URL="${{ secrets.STAGING_URL }}"
          if [ -n "$STAGING_URL" ]; then
            echo "Checking $STAGING_URL/health"
            curl --fail --retry 5 --retry-delay 5 "$STAGING_URL/health" || exit 1
          fi

      - name: Webhook Notify Azure DevOps
        if: always()
        run: |
          STATUS="${{ job.status }}"
          echo "Notifying Azure DevOps of deployment status: $STATUS"
          # Azure DevOps Incoming Webhook or REST API
          if [ -n "${{ secrets.AZURE_DEVOPS_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.AZURE_DEVOPS_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{
                "eventType": "github.actions.deployment",
                "status": "'"$STATUS"'",
                "sha": "'"${{ github.sha }}"'",
                "actor": "'"${{ github.actor }}"'",
                "repo": "'"${{ github.repository }}"'",
                "runUrl": "'"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"'"
              }'
          else
            echo "No AZURE_DEVOPS_WEBHOOK_URL configured, skipping webhook."
          fi
